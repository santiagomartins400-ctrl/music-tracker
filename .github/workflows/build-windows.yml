name: Gerar instalador Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descarregar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: desktop
        run: npm install

      - name: Gerar o instalador (.exe)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - name: Guardar o instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: album-critico-windows
          path: desktop/dist/*.exe

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.13.0
          name: Music Tracker 2.13.0
          body: Instalador para Windows (64 bits). Faz duplo clique para instalar.
          files: desktop/dist/*.exe
