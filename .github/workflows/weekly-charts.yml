name: Atualizar top semanal

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar os dados
        run: node scripts/update-charts.mjs

      - name: Guardar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/charts.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Atualizar top semanal"
            git push
          fi
