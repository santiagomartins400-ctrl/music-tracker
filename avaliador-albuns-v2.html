<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f; --panel:#13131b; --panel2:#1a1a25; --line:#262636;
  --text:#eceaf5; --muted:#8c8ca6;
  --accent:#8b5cf6; --accent2:#ec4899; --good:#22c55e; --warn:#f59e0b;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Inter,system-ui,-apple-system,sans-serif; color:var(--text); min-height:100vh; background:var(--bg);
  background-image:
    radial-gradient(900px 500px at -10% -10%,rgba(139,92,246,.22),transparent 60%),
    radial-gradient(800px 500px at 110% 0%,rgba(236,72,153,.16),transparent 55%);
  background-attachment:fixed;
}
h1,h2,h3,.brand{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(10,10,15,.75);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:1.4rem;font-weight:700;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:9px;display:inline-block;background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--accent));box-shadow:0 0 24px rgba(139,92,246,.5)}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
.tab{background:none;border:none;padding:9px 16px;border-radius:10px;color:var(--muted);font-weight:600}
.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn{border:1px solid var(--line);background:var(--panel2);padding:9px 14px;border-radius:12px;font-weight:600;font-size:.9rem;transition:.2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#3a3a52;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;box-shadow:0 8px 24px -8px rgba(139,92,246,.7)}
.btn.danger{color:#ff6b8a}
.btn.ghost{background:transparent}
input[type=file]{display:none}

main{max-width:1240px;margin:auto;padding:26px 20px 60px}

/* Pesquisa */
.searchbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:10px}
.searchbox input,.searchbox select,.tools input,.tools select{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:.2s;min-width:0}
.searchbox input:focus,.searchbox select:focus,.tools input:focus,.tools select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:600}
.chip:hover{color:var(--text);border-color:#3a3a52}
.status{color:var(--muted);font-size:.9rem;margin:4px 2px 16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.tools .search{flex:1;min-width:220px}
.tools .search input{width:100%}

/* Estatísticas */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stat small{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.stat b{display:block;margin-top:6px;font-size:1.5rem;font-family:"Space Grotesk";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{color:var(--muted);font-size:.8rem}

/* Cartões (só capa) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.25s;position:relative;animation:rise .45s both}
.card:hover{transform:translateY(-4px);border-color:#3c3c58;box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}
.cover{aspect-ratio:1;position:relative;overflow:hidden;background:var(--panel2)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.badge-stars{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);padding:4px 9px;border-radius:10px;font-weight:700;font-size:.85rem;font-family:"Space Grotesk";display:flex;align-items:center;gap:5px}
.badge-stars .g{font-size:.9rem}
.fav{position:absolute;top:10px;left:10px;font-size:1.1rem;color:#fde047;text-shadow:0 2px 8px #000}
.meta{padding:14px 16px 16px}
.meta h3{margin:0;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:4px 0 0;color:var(--muted);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;margin-top:10px;font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.empty{text-align:center;padding:70px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);grid-column:1/-1}
.empty b{display:block;color:var(--text);font-size:1.2rem;margin-bottom:6px}
.skel{background:linear-gradient(90deg,var(--panel2),#22222f,var(--panel2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Estrelas */
.stars{display:inline-flex;gap:2px;line-height:1}
.g{position:relative;display:inline-block;color:#2d2d40}
.g::after{content:"★";position:absolute;left:0;top:0;color:#f59e0b;width:var(--f,0%);overflow:hidden;white-space:nowrap}
.stars.lg{font-size:2rem}
.rate-stars{display:inline-flex;gap:6px;font-size:3rem;line-height:1;user-select:none}
.sw{position:relative;display:inline-block}
.hit{position:absolute;top:0;bottom:0;width:50%;background:transparent;border:none;padding:0;cursor:pointer}
.hit.l{left:0}.hit.r{right:0}
.rate-out{display:block;margin-top:12px;font-family:"Space Grotesk";font-weight:700;font-size:1.3rem;color:var(--accent2)}
.rate-box{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;text-align:center}
.rate-label{color:var(--muted);font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(3,3,8,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(820px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 40px 100px -30px #000;animation:pop .25s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.mhead h2{margin:0;font-size:1.2rem}
.x{background:none;border:none;font-size:1.5rem;color:var(--muted);padding:4px 8px}
.x:hover{color:var(--text)}
.mbody{padding:24px}
.dlayout{display:grid;grid-template-columns:220px 1fr;gap:24px}
.dcover{width:220px;aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;background:var(--panel2);box-shadow:0 20px 40px -15px #000}
.dcover img{width:100%;height:100%;object-fit:cover;display:block}
.dinfo h2,.rate-head h2{font-size:1.8rem;margin:0}
.artist{color:var(--accent2);font-weight:600;margin-top:4px}
.sub{color:var(--muted);font-size:.9rem;margin-top:6px}
.big{font-family:"Space Grotesk";font-size:2.2rem;font-weight:700;margin:16px 0 4px}
.big small{font-size:1rem;color:var(--muted)}
.review{margin-top:20px;padding:16px 18px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;line-height:1.6;white-space:pre-wrap;color:#d6d4e6}
.review.muted{color:var(--muted);font-style:italic}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.gal-title{margin:28px 0 12px;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center}
.gal-title small{color:var(--muted);font-weight:500;font-family:Inter}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery a{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:var(--panel2)}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform .3s;display:block}
.gallery a:hover img{transform:scale(1.06)}
.gallery .skel{width:100%;height:100%;border-radius:12px}
.rate-head{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;margin-bottom:20px}
.rate-cover{width:120px;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--panel2)}
.rate-cover img{width:100%;height:100%;object-fit:cover;display:block}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:.82rem;color:var(--muted);font-weight:600}
.field textarea{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:.2s;min-height:110px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted)}
.check input{accent-color:var(--accent2);width:18px;height:18px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:14px;transition:.35s;z-index:99;box-shadow:0 20px 40px -10px #000;font-weight:600}
.toast.show{transform:translateX(-50%)}

@media(max-width:860px){
  .searchbox{grid-template-columns:1fr 1fr}
  .searchbox input{grid-column:1/-1}
  .stats{grid-template-columns:repeat(2,1fr)}
  .dlayout{grid-template-columns:1fr}
  .dcover{width:100%;max-width:260px;margin:auto}
  .rate-head{grid-template-columns:1fr;text-align:center}
  .rate-cover{margin:auto}
}

/* Ecrã de conta: moldura animada e pré-visualização */
.modal.auth-glow{
  border:1px solid transparent;
  background:linear-gradient(var(--panel),var(--panel)) padding-box, linear-gradient(120deg,#8b5cf6,#ec4899,#22d3ee,#8b5cf6) border-box;
  background-size:100% 100%, 300% 100%;
  animation:pop .25s both, gshift 5s linear infinite, glowb 3s ease-in-out infinite;
}
@keyframes gshift{from{background-position:0 0,0 0}to{background-position:0 0,300% 0}}
@keyframes glowb{0%,100%{box-shadow:0 0 0 1px rgba(139,92,246,.35),0 0 30px -6px rgba(139,92,246,.5)}50%{box-shadow:0 0 0 1px rgba(236,72,153,.35),0 0 40px -4px rgba(236,72,153,.55)}}
.live{margin:4px 0 14px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);min-height:0}
#authForm input{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;margin-top:6px}
#authForm input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
#authForm .field{margin-bottom:12px}
.pv-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.pv-email{font-family:"Space Grotesk",Inter,sans-serif;font-size:1.05rem;margin-top:4px;word-break:break-all;min-height:1.4em}
.pv-email::after{content:"";display:inline-block;width:2px;height:1.1em;margin-left:3px;vertical-align:-3px;background:var(--accent2);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.pv-stars{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;min-height:24px;color:#f59e0b;font-size:1.25rem}
.pv-stars span{animation:starpop .35s both}
@keyframes starpop{0%{transform:scale(0) rotate(-60deg);opacity:0}70%{transform:scale(1.25);opacity:1}100%{transform:none}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><i></i>Music Tracker</div>
    <div class="tabs">
      <button class="tab on" data-tab="catalog">Catálogo</button>
      <button class="tab" data-tab="library">Biblioteca</button>
      <button class="tab" data-tab="charts">Top semanal</button>
    </div>
    <button class="btn ghost" id="btnAccount" type="button">Entrar</button>
  </div>
</header>

<main>
  <!-- CATÁLOGO -->
  <section id="view-catalog">
    <form class="searchbox" id="searchForm">
      <input id="cq" placeholder="Artista ou álbum (opcional) — ex.: Radiohead, Amália…" autocomplete="off">
      <button class="btn primary" type="submit">Pesquisar</button>
    </form>
    <div class="status" id="status">Escreve um artista ou álbum para pesquisar. Enquanto não pesquisas, aparecem os álbuns mais ouvidos da semana.</div>
    <div class="tabs" style="display:inline-flex;margin-bottom:18px">
      <button class="tab on" data-ct="Album">Álbuns <span id="cnt-Album"></span></button>
      <button class="tab" data-ct="EP">EPs <span id="cnt-EP"></span></button>
      <button class="tab" data-ct="Single">Singles <span id="cnt-Single"></span></button>
    </div>
    <section class="grid" id="catGrid"></section>
  </section>

  <!-- BIBLIOTECA -->
  <section id="view-library" class="hidden">
    <section class="stats" id="stats"></section>
    <section class="tools">
      <div class="search"><input id="q" placeholder="Pesquisar na biblioteca…" autocomplete="off"></div>
      <select id="lgenre"></select>
      <select id="sort">
        <option value="stars-desc">Melhor classificação</option>
        <option value="stars-asc">Pior classificação</option>
        <option value="recent">Mais recentes</option>
        <option value="year-desc">Ano (novo → antigo)</option>
        <option value="year-asc">Ano (antigo → novo)</option>
        <option value="artist">Artista (A → Z)</option>
        <option value="fav">Favoritos primeiro</option>
      </select>
      <button class="btn ghost" id="btnSpotify">Ligar Spotify</button>
      <button class="btn ghost" id="btnExport">Exportar</button>
      <label class="btn ghost" for="fileImport">Importar</label>
      <input type="file" id="fileImport" accept="application/json">
    </section>
    <section class="grid" id="libGrid"></section>
  </section>

  <section id="view-charts" class="hidden">
    <span class="status" id="chStatus" style="display:block;margin:0 0 14px"></span>
    <div class="tabs" style="display:inline-flex;margin:4px 0 18px">
      <button class="tab on" data-chk="albums">Álbuns</button>
      <button class="tab" data-chk="songs">Músicas</button>
      <button class="tab" data-chk="artists">Artistas</button>
    </div>
    <section class="grid" id="chGrid"></section>
  </section>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'album-critico-v3';
const OLD_KEY = 'album-critico-v2';
const SUGGESTIONS = ['Fado','Hip hop','Rock','Jazz','Pop','Música clássica','Eletrónica','Reggaeton','Kizomba','Samba','Metal','Sertanejo'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt = n => Number(n).toFixed(1);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

/* ---------- Armazenamento ---------- */
function seed(){
  const now=Date.now();
  return [
    {id:uid(),sourceId:'',artist:'Radiohead',title:'OK Computer',year:'1997',genre:'Alternative',cover:'',tracks:0,fav:true,stars:4.5,createdAt:now-3000,
     review:'Um disco que parece um aviso sobre o futuro e continua a soar atual.'},
    {id:uid(),sourceId:'',artist:'Frank Ocean',title:'Blonde',year:'2016',genre:'R&B/Soul',cover:'',tracks:0,fav:false,stars:4,createdAt:now-2000,
     review:'Intimista e fragmentado, com produção minimalista que deixa espaço para a emoção.'}
  ];
}
function migrate(a){
  const v=Object.values(a.criteria||{}); const m=v.length?v.reduce((s,x)=>s+x,0)/v.length:0;
  const {criteria, ...rest}=a;
  return {...rest, stars: Math.round(m/2*2)/2};
}
/* ---------- Contas (locais, neste navegador) ---------- */
const ACC_KEY = 'album-critico-accounts';
const SESS_KEY = 'album-critico-session';
function getAccounts(){ try{ return JSON.parse(localStorage.getItem(ACC_KEY))||{}; }catch(e){ return {}; } }
function setAccounts(acc){ try{ localStorage.setItem(ACC_KEY, JSON.stringify(acc)); }catch(e){} }
function currentUser(){ try{ return localStorage.getItem(SESS_KEY)||''; }catch(e){ return ''; } }
function libKey(){ const u=currentUser(); return u ? `${KEY}:${u}` : KEY; }
async function hashPw(pw, salt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pw));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function load(){
  const k=libKey();
  try{ const d=JSON.parse(localStorage.getItem(k)); if(Array.isArray(d)) return d; }catch(e){}
  if(k!==KEY) return [];
  try{ const o=JSON.parse(localStorage.getItem(OLD_KEY)); if(Array.isArray(o)) return o.map(migrate); }catch(e){}
  return seed();
}
let db = load();
function persist(){ try{ localStorage.setItem(libKey(), JSON.stringify(db)); }catch(e){} }

const registry = new Map();
const findLib = a => db.find(x => x.id===a.id || (a.sourceId && x.sourceId===a.sourceId));

/* ---------- Estrelas ---------- */
function starsRead(v, cls=''){
  let h=`<span class="stars ${cls}" aria-label="${fmt(v)} de 5">`;
  for(let i=1;i<=5;i++){ const p=clamp(v-(i-1),0,1)*100; h+=`<span class="g" style="--f:${p}%">★</span>`; }
  return h+'</span>';
}
function starsInput(){
  let h='<div class="rate-stars" id="rateStars">';
  for(let i=1;i<=5;i++){
    h+=`<span class="sw"><span class="g" style="--f:0%">★</span><button type="button" class="hit l" data-v="${i-0.5}" aria-label="${fmt(i-0.5)}"></button><button type="button" class="hit r" data-v="${i}" aria-label="${fmt(i)}"></button></span>`;
  }
  return h+'</div>';
}

/* ---------- Capas ---------- */
function coverHTML(a){
  const img = a.cover ? `<img loading="lazy" src="${esc(a.cover)}" alt="${esc(a.title)}" onerror="this.remove()">` : '';
  return `<div class="cover">${img}</div>`;
}

/* ---------- Catálogo (MusicBrainz: país de origem do artista) ---------- */
let catalog = [];
let catTab = 'Album';
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const MB = 'https://musicbrainz.org/ws/2';
async function mbGet(path){
  const r = await fetch(MB + path);
  if(!r.ok) throw new Error('mb '+r.status);
  return r.json();
}
function rgNormalize(g, fallback){
  const artist = (g['artist-credit']||[]).map(c=>c.name + (c.joinphrase||'')).join('') || fallback;
  return {
    id:'mb-'+g.id, sourceId:'mb-'+g.id, rgid:g.id,
    artist, title:g.title||'', year:(g['first-release-date']||'').slice(0,4),
    type:g['primary-type']||'Album', genre:'',
    cover:`https://coverartarchive.org/release-group/${g.id}/front-500`, tracks:0
  };
}
function getCharts(){
  if(chartsData) return Promise.resolve(chartsData);
  return fetch('data/charts.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>(chartsData=d)).catch(()=>null);
}
async function loadSuggestions(){
  setStatus('A carregar os álbuns mais populares…');
  $('#catGrid').innerHTML=skeletons(8);
  const d = await getCharts();
  const list = d?.global?.albums || [];
  if(!list.length){
    catalog=[]; renderCatalog();
    setStatus('Escreve um artista ou álbum para pesquisar.');
    return;
  }
  catalog = list.map(x=>({
    id:'top-'+x.artist+'|'+x.title, sourceId:'top-'+x.artist+'|'+x.title,
    title:x.title, artist:x.artist, type:'Album', rgid:null,
    year:null, cover:x.cover, tracks:0
  }));
  catalog.forEach(x=>registry.set(x.id,x));
  renderCatalog();
  setStatus('Sugestões: os álbuns mais populares da semana · escreve acima para pesquisar');
}
async function searchCatalog(term){
  const q=(term ?? $('#cq').value).trim().replace(/"/g,'');
  $('#cq').value=q;
  if(!q){ loadSuggestions(); return; }
  const query=`(artist:"${q}" OR tag:"${q}")`;
  catalog=[]; renderCatalog();
  setStatus(`A procurar “${q}”…`);
  $('#catGrid').innerHTML=skeletons(8);
  try{
    const a = await mbGet(`/artist/?query=${encodeURIComponent(query)}&fmt=json&limit=8`);
    const artists = a.artists||[];
    if(!artists.length){
      $('#catGrid').innerHTML='';
      setStatus(`Nenhum resultado para “${q}”. Experimenta outro termo.`);
      return;
    }
    const all=[];
    for(let i=0;i<artists.length;i++){
      const ar=artists[i];
      setStatus(`A carregar a discografia de ${ar.name} (${i+1}/${artists.length})…`);
      try{
        const rg = await mbGet(`/release-group/?artist=${ar.id}&limit=100&fmt=json`);
        (rg['release-groups']||[]).forEach(g=>{
          if((g['secondary-types']||[]).length) return;
          if(!['Album','EP','Single'].includes(g['primary-type'])) return;
          all.push(rgNormalize(g, ar.name));
        });
      }catch(e){}
      if(i<artists.length-1) await sleep(1100);
    }
    catalog=all; all.forEach(x=>registry.set(x.id,x));
    renderCatalog();
    setStatus(`${all.length} lançamentos de ${artists.length} artistas para “${q}” · fonte: MusicBrainz`);
  }catch(e){
    renderCatalog();
    setStatus('Não foi possível obter resultados. Verifica a ligação à internet e tenta de novo.');
  }
}
function renderCatalog(){
  const count=t=>catalog.filter(a=>a.type===t).length;
  ['Album','EP','Single'].forEach(t=>{ const el=$('#cnt-'+t); if(el) el.textContent=count(t)?`(${count(t)})`:''; });
  document.querySelectorAll('[data-ct]').forEach(b=>b.classList.toggle('on', b.dataset.ct===catTab));
  if(!catalog.length){
    $('#catGrid').innerHTML=`<div class="empty"><b>Pesquisa um artista ou álbum</b>Os resultados aparecem aqui.</div>`;
    return;
  }
  const list=catalog.filter(a=>a.type===catTab).sort((a,b)=>(b.year||0)-(a.year||0)||a.title.localeCompare(b.title,'pt'));
  const label={Album:'álbuns',EP:'EPs',Single:'singles'}[catTab];
  if(!list.length){ $('#catGrid').innerHTML=`<div class="empty"><b>Sem ${label} nesta pesquisa</b>Experimenta outro separador.</div>`; return; }
  $('#catGrid').innerHTML=list.map((a,i)=>{
    registry.set(a.id,a);
    const mine=findLib(a);
    return `<article class="card" style="animation-delay:${Math.min(i,12)*25}ms" data-open="${esc(a.id)}">
      ${coverHTML(a)}
      ${mine?`<span class="badge-stars">${starsRead(mine.stars)}</span>`:''}
      <div class="meta"><h3>${esc(a.title)}</h3><p>${esc(a.artist)}${a.year?' · '+esc(a.year):''}</p>
        <span class="tag">${({Album:'Álbum',EP:'EP',Single:'Single'})[a.type]||a.type}</span></div>
    </article>`;
  }).join('');
}
function setStatus(t){ $('#status').textContent=t; }
function skeletons(n){
  return Array.from({length:n},()=>`<div class="card"><div class="cover skel"></div><div class="meta"><h3>&nbsp;</h3><p>&nbsp;</p></div></div>`).join('');
}

/* ---------- Capas e artes (Cover Art Archive) ---------- */
async function findRgid(a){
  const j = await mbGet(`/release-group/?query=${encodeURIComponent(`artist:"${a.artist}" AND releasegroup:"${a.title}"`)}&fmt=json&limit=3`);
  return (j['release-groups']||[])[0]?.id || null;
}
async function loadCovers(a){
  const rgid = a.rgid || await findRgid(a);
  if(!rgid) return [];
  const r = await fetch(`https://coverartarchive.org/release-group/${rgid}`);
  if(!r.ok) return [];
  const ca = await r.json();
  return (ca.images||[]).map(img=>({
    src: img.thumbnails?.large || img.image,
    page: img.image,
    title: (img.types||[]).join(' · ') || 'Capa'
  }));
}

    <div class="stat"><small>Média</small><b>${rated.length?fmt(mean):'—'} <span style="font-size:1rem;color:var(--muted)">/ 5</span></b><span>${rated.length?starsRead(mean):''}</span></div>
    <div class="stat"><small>Melhor avaliado</small><b title="${esc(best?.title)}">${best?esc(best.title):'—'}</b><span>${best?esc(best.artist)+' · '+fmt(best.stars)+' / 5':''}</span></div>

function renderLibrary(){

/* Avaliação: só classificação, review e favorito. Os detalhes do álbum não são editáveis. */
let rate={value:0,preview:null};
function paintStars(){
  const v = rate.preview ?? rate.value;
  document.querySelectorAll('#rateStars .sw').forEach((sw,idx)=>{
    const p=clamp(v-idx,0,1)*100;
    sw.querySelector('.g').style.setProperty('--f', p+'%');
  });
  $('#rateOut').textContent = v ? `${fmt(v)} / 5` : 'Sem classificação';
}
function openRate(src){
  const existing=findLib(src);
  rate={value: existing ? existing.stars : 0, preview:null};
  openModal(`
    <div class="mhead"><h2>${existing?'Editar avaliação':'Avaliar álbum'}</h2><button class="x" data-close>×</button></div>
    <div class="mbody">

        </div>
      </div>
      <div class="rate-box">
        <div class="rate-label">A tua classificação</div>
        ${starsInput()}
        <output id="rateOut" class="rate-out"></output>
      </div>
      <div class="field"><label for="rev">Review</label><textarea id="rev" placeholder="O que achaste deste álbum?">${esc(existing?existing.review:'')}</textarea></div>
      <label class="check"><input type="checkbox" id="favChk" ${existing&&existing.fav?'checked':''}> Marcar como favorito</label>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-close>Cancelar</button>
        <button type="button" class="btn primary" id="saveRate">${existing?'Guardar':'Adicionar à biblioteca'}</button>
      </div>
    </div>`);
  paintStars();
  const wrap=$('#rateStars');
  wrap.addEventListener('mouseover',e=>{ const b=e.target.closest('.hit'); if(b){ rate.preview=+b.dataset.v; paintStars(); } });
  wrap.addEventListener('mouseleave',()=>{ rate.preview=null; paintStars(); });
  wrap.addEventListener('click',e=>{ const b=e.target.closest('.hit'); if(b){ rate.value=+b.dataset.v; rate.preview=null; paintStars(); } });
  $('#saveRate').onclick=()=>saveRate(src,existing);
}
function saveRate(src,existing){
  const v=rate.value;
  if(!v){ toast('Escolhe uma classificação de 0,5 a 5'); return; }
  const review=$('#rev').value.trim(), fav=$('#favChk').checked;
  if(existing){
    Object.assign(existing,{stars:v,review,fav});
    toast('Avaliação guardada');
  }else{
    db.unshift({
      id:uid(), sourceId:src.sourceId||src.id, artist:src.artist, title:src.title, year:src.year,
      genre:src.genre, cover:src.cover, tracks:src.tracks||0, stars:v, review, fav, createdAt:Date.now()
    });
    toast('Adicionado à biblioteca');
  }
  persist(); closeModal(); refreshAll();
}

/* ---------- Spotify (ligação por conta e importação dos álbuns guardados) ---------- */
const SPOTIFY_CLIENT_ID = 'a8dec1fd7eaf4ea58dead64851bcbe3d';
const SPOTIFY_REDIRECT = 'https://santiagomartins400-ctrl.github.io/music-tracker/avaliador-albuns-v2.html';
const spKey = () => 'album-critico-spotify:' + (currentUser() || 'guest');
const spConnected = () => !!localStorage.getItem(spKey());
function b64url(bytes){ return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function refreshSpotifyButton(){
  const b=document.getElementById('btnSpotify'); if(b) b.textContent = spConnected() ? 'Importar do Spotify' : 'Ligar Spotify';
}
async function spotifyConnect(){
  if(SPOTIFY_CLIENT_ID.startsWith('COLOCAR')){ toast('Falta o SPOTIFY_CLIENT_ID no ficheiro'); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('sp_verifier', verifier);
  sessionStorage.setItem('sp_account', currentUser());
  const p = new URLSearchParams({client_id:SPOTIFY_CLIENT_ID, response_type:'code', redirect_uri:SPOTIFY_REDIRECT,
    scope:'user-library-read', code_challenge_method:'S256', code_challenge:challenge});
  location.href = 'https://accounts.spotify.com/authorize?' + p.toString();
}
async function spotifyHandleRedirect(){
  const code = new URLSearchParams(location.search).get('code');
  if(!code || !currentUser()) return;
  history.replaceState({}, '', location.pathname);
  const verifier = sessionStorage.getItem('sp_verifier');
  if(!verifier) return;
  const r = await fetch('https://accounts.spotify.com/api/token', {method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({client_id:SPOTIFY_CLIENT_ID, grant_type:'authorization_code', code, redirect_uri:SPOTIFY_REDIRECT, code_verifier:verifier})});
  sessionStorage.removeItem('sp_verifier');
  if(!r.ok){ toast('Não foi possível ligar ao Spotify'); return; }
  const t = await r.json();
  localStorage.setItem(spKey(), JSON.stringify({access:t.access_token, refresh:t.refresh_token, exp:Date.now()+t.expires_in*1000}));
  refreshSpotifyButton();
  toast('Spotify ligado');
  await spotifyImport();
}
async function spotifyToken(){
  let st; try{ st = JSON.parse(localStorage.getItem(spKey())); }catch(e){}
  if(!st) return null;
  if(Date.now() < st.exp - 60000) return st.access;
  const r = await fetch('https://accounts.spotify.com/api/token', {method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({client_id:SPOTIFY_CLIENT_ID, grant_type:'refresh_token', refresh_token:st.refresh})});
  if(!r.ok) return null;
  const t = await r.json();
  const n = {access:t.access_token, refresh:t.refresh_token||st.refresh, exp:Date.now()+t.expires_in*1000};
  localStorage.setItem(spKey(), JSON.stringify(n));
  return n.access;
}
async function spotifyImport(){
  const tok = await spotifyToken();
  if(!tok){ toast('Liga primeiro o Spotify'); refreshSpotifyButton(); return; }
  let url = 'https://api.spotify.com/v1/me/albums?limit=50';
  let added = 0;
  try{
    while(url){
      const r = await fetch(url, {headers:{Authorization:'Bearer '+tok}});
      if(!r.ok){ toast('Não foi possível importar do Spotify'); break; }
      const j = await r.json();
      (j.items||[]).forEach(it=>{
        const al = it.album; const sid = 'spotify-'+al.id;
        if(db.some(x=>x.sourceId===sid)) return;
        db.unshift({id:uid(), sourceId:sid, artist:al.artists.map(x=>x.name).join(', '), title:al.name,
          year:(al.release_date||'').slice(0,4), genre:'', cover:al.images?.[0]?.url||'', tracks:al.total_tracks||0,
          stars:0, review:'', fav:false, createdAt:Date.now()});
        added++;
      });
      url = j.next;
    }
  }catch(e){ toast('Sem ligação ao Spotify'); }
  persist(); refreshAll();
  toast(`${added} álbuns importados do Spotify`);
}
document.getElementById('btnSpotify').addEventListener('click', ()=>{
  if(spConnected()) spotifyImport(); else spotifyConnect();
});

}));

/* ---------- Conta: criar conta e iniciar sessão ---------- */
function refreshAccountButton(){
  document.getElementById('btnAccount').textContent = currentUser() || 'Entrar';
}
function loginAs(email){
  try{ localStorage.setItem(SESS_KEY, email); }catch(e){}
  db = load();
  refreshAccountButton();
  refreshSpotifyButton();
  refreshAll();
}
function logout(){
  try{ localStorage.removeItem(SESS_KEY); }catch(e){}
  db = load();
  refreshAccountButton();
  refreshSpotifyButton();
  refreshAll();
  toast('Sessão terminada');
  openAuth('login', true);
}
function openAuth(start='login', gate=false){
  let mode=start;
  window.authGate = gate;
  openModal(`
    <div class="mhead"><h2 id="authTitle"></h2>${gate?'':'<button class="x" data-close>×</button>'}</div>
    <form class="mbody" id="authForm">
      <div class="live" id="live"><div class="pv-label">Email</div><div class="pv-email" id="pvEmail"></div><div class="pv-label" style="margin-top:12px">Palavra-passe</div><div class="pv-stars" id="pvStars"></div></div>
      <div class="field"><label for="aEmail">Email</label><input id="aEmail" type="email" required autocomplete="email"></div>
      <div class="field"><label for="aPass">Palavra-passe</label><input id="aPass" type="password" required minlength="6" autocomplete="current-password"></div>
      <p id="authErr" style="color:#ff6b8a;min-height:20px;margin:0 0 10px"></p>
      <div class="form-actions"><button type="submit" class="btn primary" id="aSubmit"></button></div>
      <p style="text-align:center;margin-top:18px;color:var(--muted)"><span id="aSwitchTxt"></span>
        <button type="button" class="btn ghost" id="aSwitch" style="padding:4px 8px"></button></p>
    </form>`);
  const err = m => { document.getElementById('authErr').textContent = m; };
  const paint = () => {
    const login = mode==='login';
    document.getElementById('authTitle').textContent = login ? 'Entrar' : 'Criar conta';
    document.getElementById('aSubmit').textContent = login ? 'Entrar' : 'Criar conta';
    document.getElementById('aSwitchTxt').textContent = login ? 'Ainda não tens conta?' : 'Já tens conta?';
    document.getElementById('aSwitch').textContent = login ? 'Criar conta' : 'Entrar';
    document.getElementById('aPass').setAttribute('autocomplete', login ? 'current-password' : 'new-password');
    document.getElementById('live').style.display = 'block';
    err('');
  };
  paint();
  const inE=document.getElementById('aEmail'), inP=document.getElementById('aPass');
  const pvE=document.getElementById('pvEmail'), pvS=document.getElementById('pvStars');
  pvE.textContent = inE.value;
  inE.addEventListener('input', ()=>{ pvE.textContent = inE.value; });
  inP.addEventListener('input', ()=>{
    const n=inP.value.length;
    while(pvS.children.length > n) pvS.lastElementChild.remove();
    for(let i=pvS.children.length;i<n;i++){ const sp=document.createElement('span'); sp.textContent='★'; pvS.appendChild(sp); }
  });
  document.getElementById('modal').classList.add('auth-glow');
  document.getElementById('aSwitch').onclick = () => { mode = mode==='login' ? 'signup' : 'login'; paint(); };
  document.getElementById('authForm').onsubmit = async ev => {
    ev.preventDefault();
    const email = document.getElementById('aEmail').value.trim().toLowerCase();
    const pw = document.getElementById('aPass').value;
    if (!/^\S+@\S+\.\S+$/.test(email)) { err('Email inválido.'); return; }
    if (pw.length < 6) { err('A palavra-passe deve ter pelo menos 6 caracteres.'); return; }
    try {
      const acc = getAccounts();
      if (mode==='signup') {
        if (acc[email]) { err('Já existe uma conta com este email.'); return; }
        const salt = uid();
        acc[email] = { salt, hash: await hashPw(pw, salt) };
        setAccounts(acc);
      } else {
        const a = acc[email];
        if (!a || (await hashPw(pw, a.salt)) !== a.hash) { err('Email ou palavra-passe incorretos.'); return; }
      }
      loginAs(email);
      closeModal();
      toast(mode==='signup' ? 'Conta criada' : 'Sessão iniciada');
    } catch (e) {
      err('Não foi possível concluir. Tenta de novo.');
    }
  };
}
document.getElementById('btnAccount').addEventListener('click', () => {
  if (currentUser()) { if (confirm('Terminar sessão?')) logout(); }
  else openAuth('login');
});
refreshAccountButton();
refreshSpotifyButton();
spotifyHandleRedirect();
showTermsIfNeeded();

loadSuggestions();
renderAllLibrary();
</script>
