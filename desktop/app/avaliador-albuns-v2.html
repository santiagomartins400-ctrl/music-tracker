<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Álbum Crítico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f; --panel:#13131b; --panel2:#1a1a25; --line:#262636;
  --text:#eceaf5; --muted:#8c8ca6;
  --accent:#8b5cf6; --accent2:#ec4899; --good:#22c55e; --warn:#f59e0b;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:Inter,system-ui,-apple-system,sans-serif; color:var(--text); min-height:100vh; background:var(--bg);
  background-image:
    radial-gradient(900px 500px at -10% -10%,rgba(139,92,246,.22),transparent 60%),
    radial-gradient(800px 500px at 110% 0%,rgba(236,72,153,.16),transparent 55%);
  background-attachment:fixed;
}
h1,h2,h3,.brand{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

header{position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(10,10,15,.75);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:1.4rem;font-weight:700;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;border-radius:9px;display:inline-block;background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--accent));box-shadow:0 0 24px rgba(139,92,246,.5)}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
.tab{background:none;border:none;padding:9px 16px;border-radius:10px;color:var(--muted);font-weight:600}
.tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn{border:1px solid var(--line);background:var(--panel2);padding:9px 14px;border-radius:12px;font-weight:600;font-size:.9rem;transition:.2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#3a3a52;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;box-shadow:0 8px 24px -8px rgba(139,92,246,.7)}
.btn.danger{color:#ff6b8a}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:.82rem}
input[type=file]{display:none}

main{max-width:1240px;margin:auto;padding:26px 20px 60px}
.hidden{display:none!important}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stat small{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.stat b{display:block;margin-top:6px;font-size:1.5rem;font-family:"Space Grotesk";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{color:var(--muted);font-size:.8rem}

/* Search bar */
.searchbox{
  background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;
  display:grid;grid-template-columns:1fr 170px 170px auto;gap:10px;
}
.searchbox input,.searchbox select{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:.2s;min-width:0}
.searchbox input:focus,.searchbox select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:600}
.chip:hover{color:var(--text);border-color:#3a3a52}
.status{color:var(--muted);font-size:.9rem;margin:4px 2px 16px}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:14px;background:var(--panel);border:1px solid var(--line);outline:none;transition:.2s}
.search::before{content:"⌕";position:absolute;left:14px;top:9px;font-size:1.2rem;color:var(--muted)}
select.sel{padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);outline:none}

/* Grid & cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.25s;position:relative;animation:rise .45s both}
.card:hover{transform:translateY(-4px);border-color:#3c3c58;box-shadow:0 20px 40px -20px rgba(0,0,0,.8)}
.cover{aspect-ratio:1;position:relative;overflow:hidden;display:grid;place-items:center}
.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cover .ini{font-family:"Space Grotesk";font-size:3.2rem;font-weight:700;opacity:.9;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.score{position:absolute;top:12px;right:12px;min-width:52px;text-align:center;padding:6px 8px;border-radius:12px;font-weight:800;font-family:"Space Grotesk";background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12)}
.badge{position:absolute;top:12px;left:12px;font-size:.7rem;font-weight:700;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12)}
.meta{padding:14px 16px 16px}
.meta h3{margin:0;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:4px 0 0;color:var(--muted);font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;margin-top:10px;font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.empty{text-align:center;padding:70px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);grid-column:1/-1}
.empty b{display:block;color:var(--text);font-size:1.2rem;margin-bottom:6px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(3,3,8,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.overlay.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(820px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 40px 100px -30px #000;animation:pop .25s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.mhead h2{margin:0;font-size:1.2rem}
.x{background:none;border:none;font-size:1.5rem;color:var(--muted);padding:4px 8px}
.x:hover{color:var(--text)}
.mbody{padding:24px}

.dlayout{display:grid;grid-template-columns:220px 1fr;gap:24px}
.dcover{width:220px;aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;display:grid;place-items:center;box-shadow:0 20px 40px -15px #000}
.dcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dcover .ini{font-family:"Space Grotesk";font-size:4rem;font-weight:700}
.dinfo h2{font-size:1.8rem;margin:0}
.dinfo .artist{color:var(--accent2);font-weight:600;margin-top:4px}
.dinfo .sub{color:var(--muted);font-size:.9rem;margin-top:6px}
.bigscore{font-family:"Space Grotesk";font-size:3.2rem;font-weight:700;margin:14px 0 4px;background:linear-gradient(135deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bars{margin-top:14px;display:grid;gap:11px}
.bar-row{display:grid;grid-template-columns:150px 1fr 36px;gap:12px;align-items:center;font-size:.9rem}
.track{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s}
.review{margin-top:20px;padding:16px 18px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;line-height:1.6;white-space:pre-wrap;color:#d6d4e6}
.review.muted{color:var(--muted);font-style:italic}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

.gal-title{margin:28px 0 12px;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center}
.gal-title small{color:var(--muted);font-weight:500;font-family:Inter}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery a{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:var(--panel2);position:relative}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform .3s;display:block}
.gallery a:hover img{transform:scale(1.06)}
.gallery .skel{width:100%;height:100%;background:linear-gradient(90deg,var(--panel2),#22222f,var(--panel2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* Form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:.82rem;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:.2s}
.field textarea{min-height:100px;resize:vertical}
.crit{grid-column:1/-1;display:grid;gap:14px;padding:18px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.crit-head{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.crit-head output{font-family:"Space Grotesk";color:var(--accent2);font-size:1.1rem}
.crow{display:grid;grid-template-columns:160px 1fr 46px;align-items:center;gap:12px;font-size:.9rem}
.crow output{text-align:right;font-weight:700;font-family:"Space Grotesk"}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(139,92,246,.35);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:#fff;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted)}
.check input{accent-color:var(--accent2);width:18px;height:18px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:14px;transition:.35s;z-index:99;box-shadow:0 20px 40px -10px #000;font-weight:600}
.toast.show{transform:translateX(-50%)}

@media(max-width:860px){
  .searchbox{grid-template-columns:1fr 1fr}
  .searchbox input{grid-column:1/-1}
  .stats{grid-template-columns:repeat(2,1fr)}
  .dlayout{grid-template-columns:1fr}
  .dcover{width:100%;max-width:260px;margin:auto}
  .form-grid{grid-template-columns:1fr}
  .crow{grid-template-columns:120px 1fr 40px}
  .bar-row{grid-template-columns:110px 1fr 34px}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><i></i>Álbum Crítico</div>
    <div class="tabs">
      <button class="tab on" data-tab="catalog">Catálogo</button>
      <button class="tab" data-tab="collection">A minha coleção</button>
    </div>
  </div>
</header>

<main>
  <!-- CATÁLOGO -->
  <section id="view-catalog">
    <form class="searchbox" id="searchForm">
      <input id="cq" placeholder="Pesquisa artista, álbum ou género (ex.: Fado, Radiohead, Hip hop)…" autocomplete="off">
      <select id="country">
        <option value="PT">Portugal</option>
        <option value="BR">Brasil</option>
        <option value="ES">Espanha</option>
        <option value="FR">França</option>
        <option value="DE">Alemanha</option>
        <option value="IT">Itália</option>
        <option value="GB">Reino Unido</option>
        <option value="US" selected>Estados Unidos</option>
        <option value="CA">Canadá</option>
        <option value="MX">México</option>
        <option value="AR">Argentina</option>
        <option value="JP">Japão</option>
        <option value="AU">Austrália</option>
        <option value="NL">Países Baixos</option>
        <option value="SE">Suécia</option>
        <option value="NG">Nigéria</option>
        <option value="ZA">África do Sul</option>
        <option value="KR">Coreia do Sul</option>
      </select>
      <select id="genre"><option value="all">Todos os géneros</option></select>
      <button class="btn primary" type="submit">Pesquisar</button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="status" id="status">Escreve algo na pesquisa ou escolhe um género sugerido.</div>
    <section class="grid" id="catGrid"></section>
  </section>

  <!-- COLEÇÃO -->
  <section id="view-collection" class="hidden">
    <section class="stats" id="stats"></section>
    <section class="tools">
      <div class="search"><input id="q" placeholder="Pesquisar na tua coleção…" autocomplete="off"></div>
      <select class="sel" id="cgenre"></select>
      <select class="sel" id="sort">
        <option value="score-desc">Melhor nota</option>
        <option value="score-asc">Pior nota</option>
        <option value="recent">Mais recentes</option>
        <option value="year-desc">Ano (novo → antigo)</option>
        <option value="year-asc">Ano (antigo → novo)</option>
        <option value="artist">Artista (A → Z)</option>
        <option value="fav">Favoritos primeiro</option>
      </select>
      <button class="btn ghost" id="btnExport">Exportar</button>
      <label class="btn ghost" for="fileImport">Importar</label>
      <input type="file" id="fileImport" accept="application/json">
      <button class="btn primary" id="btnNew">+ Novo álbum</button>
    </section>
    <section class="grid" id="colGrid"></section>
  </section>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'album-critico-v2';
const CRITERIA = [
  {k:'prod',label:'Produção'},{k:'voz',label:'Voz & Interpretação'},{k:'comp',label:'Composição'},
  {k:'coes',label:'Coesão'},{k:'emo',label:'Impacto emocional'}
];
const SUGGESTIONS = ['Fado','Hip hop','Rock','Jazz','Pop','Música clássica','Eletrónica','Reggaeton','Kizomba','Samba','Metal','Sertanejo'];
const GENRES_PRESET = ['Pop','Rock','Hip-Hop/Rap','R&B/Soul','Jazz','Electronic','Dance','Latin','Country','Classical','Metal','Alternative','Fado','Reggae','Folk','Blues','Indie','Soundtrack'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const avg = a => { const v = Object.values(a.criteria); return v.reduce((s,x)=>s+x,0)/v.length; };
const fmt = n => n.toFixed(1);
const scoreColor = n => n>=8.5?'var(--good)':n>=7?'var(--accent2)':n>=5?'var(--warn)':'var(--muted)';
const hueOf = str => { let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))%360; return h; };
const bgOf = (artist,title) => { const h=hueOf(artist+title); return `background:linear-gradient(135deg,hsl(${h} 75% 50%),hsl(${(h+50)%360} 70% 22%))`; };

/* ---------- Storage ---------- */
function seed(){
  const now=Date.now();
  return [
    {id:uid(),sourceId:'',artist:'Radiohead',title:'OK Computer',year:'1997',genre:'Alternative',cover:'',fav:true,createdAt:now-3000,
     criteria:{prod:9.5,voz:9,comp:9.5,coes:9.5,emo:9},review:'Um disco que parece um aviso sobre o futuro e continua a soar atual.'},
    {id:uid(),sourceId:'',artist:'Frank Ocean',title:'Blonde',year:'2016',genre:'R&B/Soul',cover:'',fav:false,createdAt:now-2000,
     criteria:{prod:9,voz:8.5,comp:8,coes:9,emo:9.5},review:'Intimista e fragmentado, com produção minimalista que deixa espaço para a emoção.'}
  ];
}
let db = load();
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); return Array.isArray(d)?d:seed(); }catch(e){ return seed(); } }
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){} }

/* ---------- Catálogo (iTunes Search API) ---------- */
let catalog = [];
const registry = new Map();

function normalize(x){
  return {
    id:'itunes-'+x.collectionId, sourceId:'itunes-'+x.collectionId,
    artist:x.artistName||'', title:x.collectionName||'', year:(x.releaseDate||'').slice(0,4),
    genre:x.primaryGenreName||'', cover:(x.artworkUrl100||'').replace('100x100bb','600x600bb'),
    tracks:x.trackCount||0, link:x.collectionViewUrl||''
  };
}

async function searchCatalog(term){
  const q = (term ?? $('#cq').value).trim();
  if(!q){ toast('Escreve algo para pesquisar'); return; }
  $('#cq').value = q;
  const country = $('#country').value;
  setStatus('A pesquisar “'+q+'”…');
  $('#catGrid').innerHTML = skeletons(8);
  try{
    const url = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=album&media=music&country=${country}&limit=200`;
    const r = await fetch(url);
    if(!r.ok) throw new Error();
    const j = await r.json();
    catalog = j.results.map(normalize);
    catalog.forEach(a=>registry.set(a.id,a));
    fillGenreSelect();
    renderCatalog();
    const c = $('#country').selectedOptions[0].textContent;
    setStatus(`${catalog.length} álbuns encontrados · mercado: ${c}`);
  }catch(e){
    catalog=[]; renderCatalog();
    setStatus('Não foi possível obter resultados. Verifica a ligação à internet e tenta novamente.');
  }
}

function fillGenreSelect(){
  const cur = $('#genre').value;
  const genres = [...new Set(catalog.map(a=>a.genre).filter(Boolean))].sort();
  $('#genre').innerHTML = `<option value="all">Todos os géneros</option>` + genres.map(g=>`<option ${g===cur?'selected':''}>${esc(g)}</option>`).join('');
}

function renderChips(){
  $('#chips').innerHTML = SUGGESTIONS.map(s=>`<button class="chip" data-chip="${esc(s)}">${esc(s)}</button>`).join('');
}

function renderCatalog(){
  const g = $('#genre').value;
  const list = catalog.filter(a=> g==='all' || a.genre===g);
  if(!catalog.length){
    $('#catGrid').innerHTML = `<div class="empty"><b>Pesquisa um artista, álbum ou género</b>Vais ver capas e informação de álbuns reais, filtrados pelo mercado escolhido.</div>`;
    return;
  }
  if(!list.length){ $('#catGrid').innerHTML=`<div class="empty"><b>Sem resultados para este género</b>Escolhe outro género ou “Todos os géneros”.</div>`; return; }
  $('#catGrid').innerHTML = list.map((a,i)=>{
    const mine = db.find(x=>x.sourceId===a.id);
    return `
    <article class="card" style="animation-delay:${Math.min(i,12)*25}ms" data-open="${esc(a.id)}">
      ${coverHTML(a)}
      ${mine?`<span class="score" style="color:${scoreColor(avg(mine))}">${fmt(avg(mine))}</span>`:''}
      ${a.genre?'':''}
      <div class="meta">
        <h3>${esc(a.title)}</h3>
        <p>${esc(a.artist)}${a.year?' · '+a.year:''}</p>
        ${a.genre?`<span class="tag">${esc(a.genre)}</span>`:''}
      </div>
    </article>`;
  }).join('');
}

function setStatus(t){ $('#status').textContent = t; }
function skeletons(n){ return Array.from({length:n},()=>`<div class="card"><div class="cover"><div class="skel" style="position:absolute;inset:0;background:linear-gradient(90deg,var(--panel2),#22222f,var(--panel2));background-size:200% 100%;animation:sh 1.2s infinite"></div></div><div class="meta"><h3>&nbsp;</h3><p>&nbsp;</p></div></div>`).join(''); }

/* ---------- Capas e artes (MusicBrainz + Cover Art Archive) ---------- */
async function loadPhotos(a){
  const q = `artist:"${a.artist}" AND releasegroup:"${a.title}"`;
  const mbR = await fetch(`https://musicbrainz.org/ws/2/release-group/?query=${encodeURIComponent(q)}&fmt=json&limit=5`);
  if(!mbR.ok) throw new Error();
  const mb = await mbR.json();
  const groups = (mb['release-groups']||[]).filter(g => (g.title||'').toLowerCase() === a.title.toLowerCase());
  const rg = groups[0] || (mb['release-groups']||[])[0];
  if(!rg) return [];
  const caR = await fetch(`https://coverartarchive.org/release-group/${rg.id}`);
  if(!caR.ok) return [];
  const ca = await caR.json();
  return (ca.images||[]).map(img => ({
    src: img.thumbnails?.large || img.thumbnails?.['500'] || img.image,
    page: img.image,
    title: (img.types||[]).join(' · ') || 'Capa'
  }));
}

/* ---------- Helpers de capa ---------- */
function coverHTML(a, cls='ini'){
  const img = a.cover ? `<img loading="lazy" src="${esc(a.cover)}" alt="" onerror="this.remove()">` : '';
  const ini = (a.title||'?').trim().charAt(0).toUpperCase();
  return `<div class="cover" style="${a.cover?'':bgOf(a.artist,a.title)}">${img}<span class="${cls}">${esc(ini)}</span></div>`;
}

/* ---------- Coleção ---------- */
function renderStats(){
  const n=db.length, mean=n?db.reduce((s,a)=>s+avg(a),0)/n:0;
  const best=n?[...db].sort((a,b)=>avg(b)-avg(a))[0]:null;
  const counts={}; db.forEach(a=>counts[a.artist]=(counts[a.artist]||0)+1);
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  $('#stats').innerHTML = `
    <div class="stat"><small>Álbuns</small><b>${n}</b><span>${db.filter(a=>a.fav).length} favoritos</span></div>
    <div class="stat"><small>Média geral</small><b style="color:${n?scoreColor(mean):'inherit'}">${n?fmt(mean):'—'}</b><span>em 10</span></div>
    <div class="stat"><small>Melhor avaliado</small><b title="${esc(best?.title)}">${best?esc(best.title):'—'}</b><span>${best?esc(best.artist)+' · '+fmt(avg(best)):''}</span></div>
    <div class="stat"><small>Artista mais avaliado</small><b>${top?esc(top[0]):'—'}</b><span>${top?top[1]+' álbum(ns)':''}</span></div>`;
}
function renderCollectionGenres(){
  const cur=$('#cgenre').value||'all';
  const gs=[...new Set(db.map(a=>a.genre).filter(Boolean))].sort();
  $('#cgenre').innerHTML=`<option value="all">Todos os géneros</option>`+gs.map(g=>`<option ${g===cur?'selected':''}>${esc(g)}</option>`).join('');
}
function renderCollection(){
  const q=$('#q').value.trim().toLowerCase(), g=$('#cgenre').value;
  const cmp={
    'score-desc':(a,b)=>avg(b)-avg(a),'score-asc':(a,b)=>avg(a)-avg(b),'recent':(a,b)=>b.createdAt-a.createdAt,
    'year-desc':(a,b)=>(+b.year||0)-(+a.year||0),'year-asc':(a,b)=>(+a.year||0)-(+b.year||0),
    'artist':(a,b)=>a.artist.localeCompare(b.artist,'pt'),'fav':(a,b)=>(b.fav-a.fav)||(avg(b)-avg(a))
  }[$('#sort').value];
  const list=db.filter(a=>(g==='all'||a.genre===g)&&(!q||[a.artist,a.title,a.genre,a.review].join(' ').toLowerCase().includes(q))).sort(cmp);
  if(!db.length){ $('#colGrid').innerHTML=`<div class="empty"><b>A tua coleção está vazia</b>Pesquisa no catálogo e adiciona álbuns para os avaliar.</div>`; return; }
  if(!list.length){ $('#colGrid').innerHTML=`<div class="empty"><b>Nada encontrado</b>Experimenta outra pesquisa ou filtro.</div>`; return; }
  $('#colGrid').innerHTML=list.map((a,i)=>{
    registry.set(a.id,a); const s=avg(a);
    return `<article class="card" style="animation-delay:${Math.min(i,12)*30}ms" data-open="${a.id}">
      ${coverHTML(a)}
      ${a.fav?'<span class="badge">★ Favorito</span>':''}
      <span class="score" style="color:${scoreColor(s)}">${fmt(s)}</span>
      <div class="meta"><h3>${esc(a.title)}</h3><p>${esc(a.artist)}${a.year?' · '+esc(a.year):''}</p>
        ${a.genre?`<span class="tag">${esc(a.genre)}</span>`:''}</div></article>`;
  }).join('');
}
function renderAllCollection(){ renderStats(); renderCollectionGenres(); renderCollection(); }

/* ---------- Modal ---------- */
function openModal(html){ $('#modal').innerHTML=html; $('#overlay').classList.add('open'); }
function closeModal(){ $('#overlay').classList.remove('open'); $('#modal').innerHTML=''; }

function openAlbum(id){
  const a = registry.get(id) || db.find(x=>x.id===id) || catalog.find(x=>x.id===id);
  if(!a) return;
  const mine = db.find(x=>x.id===a.id || (a.sourceId && x.sourceId===a.sourceId));
  const rated = mine ? mine : null;
  const extra = rated ? `
    <div class="dinfo">
      <div class="bigscore">${fmt(avg(rated))}<span style="font-size:1.1rem;color:var(--muted)"> /10</span></div>
      <div class="bars">${CRITERIA.map(c=>`<div class="bar-row"><span>${c.label}</span><div class="track"><div class="fill" style="width:${rated.criteria[c.k]*10}%"></div></div><b>${fmt(rated.criteria[c.k])}</b></div>`).join('')}</div>
    </div>` : '';
  const info = `
    <h2>${esc(a.title)}</h2>
    <div class="artist">${esc(a.artist)}</div>
    <div class="sub">${[a.year,a.genre,a.tracks?a.tracks+' faixas':''].filter(Boolean).map(esc).join(' · ')}</div>`;
  const actions = mine
    ? `<button class="btn primary" data-edit="${mine.id}">Editar avaliação</button>
       <button class="btn" data-fav="${mine.id}">${mine.fav?'★ Remover favorito':'☆ Favorito'}</button>
       <button class="btn danger" data-del="${mine.id}" style="margin-left:auto">Remover</button>`
    : `<button class="btn primary" data-rate="${esc(a.id)}">+ Adicionar e avaliar</button>`;
  openModal(`
    <div class="mhead"><h2>Álbum</h2><button class="x" data-close>×</button></div>
    <div class="mbody">
      <div class="dlayout">
        <div class="dcover">${coverHTML(a)}</div>
        <div>${info}${extra}</div>
      </div>
      ${rated ? `<div class="review ${rated.review?'':'muted'}">${rated.review?esc(rated.review):'Sem review escrita.'}</div>` : ''}
      <div class="actions">${actions}</div>
      <div class="gal-title">Capas e artes <small>Cover Art Archive</small></div>
      <div class="gallery" id="gallery">${Array.from({length:6},()=>'<div><div class="skel"></div></div>').join('')}</div>
    </div>`);
  loadPhotos(a).then(photos=>{
    if(!photos.length && a.cover) photos=[{src:a.cover,page:a.cover,title:a.title}];
    const g=$('#gallery'); if(!g) return;
    g.innerHTML = photos.length
      ? photos.map(p=>`<a href="${esc(p.page)}" target="_blank" rel="noopener" title="${esc(p.title)}"><img loading="lazy" src="${esc(p.src)}" alt="${esc(p.title)}" onerror="this.parentElement.remove()"></a>`).join('')
      : `<div class="empty" style="grid-column:1/-1;padding:30px">Sem capas disponíveis para este álbum.</div>`;
  }).catch(()=>{
    const g=$('#gallery'); if(g) g.innerHTML=`<div class="empty" style="grid-column:1/-1;padding:30px">Não foi possível carregar as capas.</div>`;
  });
}

function openForm(id, pre){
  const base = id ? db.find(x=>x.id===id) : {artist:'',title:'',year:'',genre:'',cover:'',fav:false,review:'',sourceId:'',criteria:{prod:7,voz:7,comp:7,coes:7,emo:7}, ...(pre||{})};
  const a = {...base, criteria:{prod:7,voz:7,comp:7,coes:7,emo:7, ...(base.criteria||{})}};
  const rows = CRITERIA.map(c=>`<div class="crow"><label for="c_${c.k}">${c.label}</label><input type="range" min="0" max="10" step="0.5" id="c_${c.k}" value="${a.criteria[c.k]}"><output>${fmt(a.criteria[c.k])}</output></div>`).join('');
  openModal(`
    <div class="mhead"><h2>${id?'Editar avaliação':'Avaliar álbum'}</h2><button class="x" data-close>×</button></div>
    <form class="mbody" id="form">
      <div class="form-grid">
        <div class="field"><label>Artista *</label><input name="artist" required value="${esc(a.artist)}"></div>
        <div class="field"><label>Álbum *</label><input name="title" required value="${esc(a.title)}"></div>
        <div class="field"><label>Ano</label><input name="year" type="number" min="1900" max="2100" value="${esc(a.year)}"></div>
        <div class="field"><label>Género</label><input name="genre" list="genres" value="${esc(a.genre)}"><datalist id="genres">${GENRES_PRESET.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>
        <div class="field full"><label>URL da capa (opcional)</label><input name="cover" type="url" value="${esc(a.cover)}" placeholder="https://…"></div>
        <div class="crit">
          <div class="crit-head"><span>Critérios</span><output id="avgOut">${fmt(avg(a))}</output></div>${rows}
        </div>
        <div class="field full"><label>Review</label><textarea name="review" placeholder="O que achaste deste álbum?">${esc(a.review)}</textarea></div>
        <label class="check full"><input type="checkbox" name="fav" ${a.fav?'checked':''}> Marcar como favorito</label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-close>Cancelar</button>
        <button type="submit" class="btn primary">${id?'Guardar':'Adicionar à coleção'}</button>
      </div>
    </form>`);

  const form=$('#form');
  CRITERIA.forEach(c=>{
    const input=$('#c_'+c.k), out=input.parentElement.querySelector('output');
    input.addEventListener('input',()=>{ out.textContent=fmt(+input.value); updateAvg(); });
  });
  function updateAvg(){
    const vals=CRITERIA.map(c=>+$('#c_'+c.k).value);
    $('#avgOut').textContent=fmt(vals.reduce((s,x)=>s+x,0)/vals.length);
  }
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const f=new FormData(form), criteria={};
    CRITERIA.forEach(c=>criteria[c.k]=+$('#c_'+c.k).value);
    const data={artist:f.get('artist').trim(),title:f.get('title').trim(),year:f.get('year')||'',genre:f.get('genre').trim(),
      cover:f.get('cover').trim(),review:f.get('review').trim(),fav:f.get('fav')==='on',criteria,sourceId:a.sourceId||''};
    if(id){
      Object.assign(db.find(x=>x.id===id),data); persist(); renderAllCollection(); toast('Avaliação guardada'); openAlbum(id);
    }else{
      const novo={id:uid(),createdAt:Date.now(),...data}; db.unshift(novo); persist(); renderAllCollection(); renderCatalog();
      closeModal(); toast('Adicionado à coleção');
    }
  });
}

/* ---------- Toast ---------- */
let tt;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- Eventos ---------- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  const c=b.dataset.tab==='catalog';
  $('#view-catalog').classList.toggle('hidden',!c);
  $('#view-collection').classList.toggle('hidden',c);
  if(!c) renderAllCollection();
});

$('#searchForm').addEventListener('submit',e=>{ e.preventDefault(); searchCatalog(); });
$('#chips').addEventListener('click',e=>{ const c=e.target.closest('[data-chip]'); if(c){ $('#cq').value=c.dataset.chip; searchCatalog(c.dataset.chip); } });
$('#genre').addEventListener('change',renderCatalog);
$('#country').addEventListener('change',()=>{ if($('#cq').value.trim()) searchCatalog(); });

$('#q').addEventListener('input',renderCollection);
$('#cgenre').addEventListener('change',renderCollection);
$('#sort').addEventListener('change',renderCollection);
$('#btnNew').onclick=()=>openForm(null);

document.addEventListener('click',e=>{
  const card=e.target.closest('[data-open]');
  if(card && (card.closest('#catGrid')||card.closest('#colGrid'))) openAlbum(card.dataset.open);
});

$('#overlay').addEventListener('click',e=>{
  if(e.target.id==='overlay'||e.target.hasAttribute('data-close')) return closeModal();
  const rate=e.target.closest('[data-rate]'), ed=e.target.closest('[data-edit]'), fv=e.target.closest('[data-fav]'), dl=e.target.closest('[data-del]');
  if(rate){
    const a=registry.get(rate.dataset.rate)||catalog.find(x=>x.id===rate.dataset.rate);
    closeModal(); openForm(null,{artist:a.artist,title:a.title,year:a.year,genre:a.genre,cover:a.cover,sourceId:a.sourceId});
  }
  if(ed){ closeModal(); openForm(ed.dataset.edit); }
  if(fv){ const a=db.find(x=>x.id===fv.dataset.fav); a.fav=!a.fav; persist(); renderAllCollection(); openAlbum(a.id); }
  if(dl){
    const a=db.find(x=>x.id===dl.dataset.del);
    if(a && confirm(`Remover “${a.title}” da coleção?`)){ db=db.filter(x=>x.id!==a.id); persist(); renderAllCollection(); renderCatalog(); closeModal(); toast('Removido'); }
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

$('#btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'album-critico.json'});
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Exportado');
};
$('#fileImport').onchange=async e=>{
  const file=e.target.files[0]; if(!file) return;
  try{
    const data=JSON.parse(await file.text()); if(!Array.isArray(data)) throw new Error();
    const ids=new Set(db.map(a=>a.id)); data.forEach(a=>{ if(!ids.has(a.id)) db.push(a); });
    persist(); renderAllCollection(); toast(`${data.length} álbuns importados`);
  }catch{ toast('Ficheiro inválido'); }
  e.target.value='';
};

renderChips();
renderAllCollection();
</script>
</body>
